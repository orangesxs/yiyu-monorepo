# 「一隅」前端站点 Nginx 配置(挂载进 web 容器,替代默认配置)
#
# 职责:
#   1. 托管前端静态文件(vue 构建产物,hash 路由)
#   2. 把 /api 请求反代给后端 server 容器 —— 同源部署,无 CORS 问题,
#      等价于本地开发的 vite proxy(/api → localhost:3000)

server {
    listen 80;              # 容器内监听 80(对外由 compose 映射宿主机 80)
    server_name _;          # 匹配任意主机名/IP 访问

    # ── 1. 前端静态文件 ──
    # Dockerfile 已把 vue 构建产物拷到容器内该目录
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # hash 路由其实只需返回 index.html,保留 try_files 兜底:
        # 先找真实文件 → 再找目录 → 都没有就回 index.html(交给前端路由)
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源,可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 2. API 反向代理 ──
    # server 是 compose 里的后端服务名,内部网络直接按名字访问其 3000 端口
    location /api/ {
        proxy_pass http://server:3000;
        # 传递真实客户端信息,后端日志/限流能拿到真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE(agent 对话流):关缓冲防 nginx 攒满再发,读超时放宽到 5 分钟
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # HTTP/1.1 长连接(agent 心跳 15s,配合 read_timeout 防空闲断连)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
