# 「一隅」测试环境一键部署编排文件
# 用法:cd deploy && docker compose up -d --build
# 敏感配置(DB 密码 / JWT 密钥)从同目录 .env 读取,见 .env.example

services:
  # ── 数据库:PostgreSQL 16,直接用官方镜像,无需构建 ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped          # 异常退出或服务器重启后自动拉起(手动 stop 的除外)
    ports:
      # 暴露到宿主机,本地 Prisma CLI / psql 可直连 localhost:5432
      # ⚠️ 仅本地开发用;若部署到公网服务器,删掉这两行,避免数据库暴露
      - "5432:5432"
    environment:
      POSTGRES_USER: yiyu                      # 初始化建的数据库用户
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yiyu_test_2026}   # 密码来自 .env 的 DB_PASSWORD,冒号后为缺省值
      POSTGRES_DB: yiyu                        # 初始化建的数据库名
    volumes:
      # 数据卷 pgdata:数据库文件落在宿主机磁盘,容器重建/升级数据不丢
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 每 5 秒探一次数据库是否就绪;server 依赖这里的 healthy 状态决定何时启动
      test: ["CMD-SHELL", "pg_isready -U yiyu -d yiyu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 后端:NestJS,用 ../yiyu-server/Dockerfile 构建 ──
  server:
    build: ../yiyu-server
    restart: unless-stopped
    environment:
      # 数据库连接配置:主机名直接写服务名 db(Compose 内部网络按名字互访)
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: yiyu
      DB_PASSWORD: ${DB_PASSWORD:-yiyu_test_2026}
      DB_NAME: yiyu
      # Prisma 连接串(与上面各分量保持一致)
      DATABASE_URL: postgresql://yiyu:${DB_PASSWORD:-yiyu_test_2026}@db:5432/yiyu
      # JWT 密钥来自 .env,登录 token 用它签名;泄露可伪造登录态,务必随机
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES: 7d
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy   # 等 db 通过健康检查再启动,避免起早了连不上库

  # ── 前端:Nginx 托管静态页面 + 反代 API,用 ../yiyu/Dockerfile 构建 ──
  web:
    build: ../yiyu
    restart: unless-stopped
    ports:
      # 唯一对外暴露的容器:宿主机 80 → 容器 80,浏览器直接访问的入口
      - "80:80"
    volumes:
      # 用本目录的 nginx.conf 覆盖 Nginx 默认站点配置(:ro 只读)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

# 命名卷:持久化 PostgreSQL 数据
volumes:
  pgdata:
