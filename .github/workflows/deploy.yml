# 「一隅」自动部署:push 到 main → SSH 到服务器拉最新代码并重建容器
#
# 前置条件(已配置):
#   仓库 Secrets:
#     - DEPLOY_SSH_KEY : 部署专用 SSH 私钥(公钥已追加到服务器 ~/.ssh/authorized_keys)
#   仓库 Variables:
#     - DEPLOY_HOST : 服务器公网 IP
#   服务器上:/root/yiyu-monorepo 已完成首次手动部署(deploy/.env 已生成)
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 部署不互相打断,排队执行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 服务器拉取代码并重建容器
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/yiyu-monorepo
            # 服务器直连 GitHub 不稳,两类典型报错:
            #   curl 16 HTTP2 framing layer → 强制 HTTP/1.1 规避(GnuTLS 下 HTTP/2 常见)
            #   GnuTLS recv -110 / 连接超时 → 多次重试,5 次通 1 次即可完成部署
            git config http.version HTTP/1.1
            for i in 1 2 3 4 5; do
              if git pull --ff-only; then break; fi
              [ "$i" = "5" ] && { echo "::error::git pull 五次均失败,中止部署(服务器到 GitHub 网络异常)"; exit 1; }
              echo "git pull 失败,$((i*10)) 秒后重试($i/5)…"; sleep $((i*10))
            done
            HEAD=$(git rev-parse --short HEAD)
            echo "部署提交: $HEAD"
            cd deploy
            docker compose up -d --build
            docker compose ps
            # 验证容器实际在跑新代码:后端健康检查返回即认为服务起来了
            sleep 5
            curl -sf http://localhost/api/health > /dev/null && echo "健康检查通过" || { echo "::error::后端健康检查失败"; docker compose logs --tail 30 server; exit 1; }
